name: deploy

# Build estro.help and publish it to GitHub Pages on every push to main. The
# site runs estrogen itself in the browser through the wasm core, so this builds
# the Rust binary and the wasm from source (the wasm is not committed; the web
# build regenerates it with build-wasm.sh), then the npm plugin, then the Astro
# site, which the post-build pass obfuscates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.7.3
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Build the estrogen binary
        run: cargo build --release -p estrogen-cli
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 20
      - name: Build the npm plugin
        run: |
          cd npm/estrogen
          npm ci || npm install
          npm run build
      - name: Build the site
        run: |
          cd web
          npm install
          npm run build
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
