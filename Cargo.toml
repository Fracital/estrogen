[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "ISC"
authors = ["David Reed"]
repository = "https://github.com/Fracital/crack"

# Shared dependency pins. OXC moves fast and its crates must agree on one
# version, so they are pinned exact (`=`) and checked against crates.io before a
# bump. Cargo.lock is committed, so these are the versions every build uses.
[workspace.dependencies]
oxc_allocator = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_span = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_diagnostics = "=0.159.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1"
# Pool encoding and the per-file key material. ChaCha20 is implemented in-crate
# (crack-core/src/chacha.rs) so the Rust encryptor and the emitted JS decoder
# run the same block function; the symmetry test proves it. base64 fixes the
# exact standard alphabet the pool uses, getrandom is the production key source,
# and sha2 derives the deterministic per-file seed for --seed.
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
# Proxy-name pass: the token regex, the per-build keyed same-length rename
# (HMAC-SHA256), and the globs that select which files take the proxy path.
regex = "1"
hmac = "0.12"
globset = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
