[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "ISC"
authors = ["David Reed"]
repository = "https://github.com/Fracital/estrogen"

# Shared dependency pins. OXC moves fast and its crates must agree on one
# version, so they are pinned exact (`=`) and checked against crates.io before a
# bump. Cargo.lock is committed, so these are the versions every build uses.
[workspace.dependencies]
oxc_allocator = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_span = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_diagnostics = "=0.159.0"
oxc_semantic = "=0.159.0"
oxc_mangler = "=0.159.0"
# Minified printing for the vendored VM runtime only (vm/mod.rs). The runtime is
# estrogen's own embedded asset, not user app code, so it is mangled and reprinted
# at embed time instead of edited in place.
oxc_codegen = "=0.159.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rayon = "1"
# Pool encoding and the per-file key material. ChaCha20 is implemented in-crate
# (estrogen-core/src/chacha.rs) so the Rust encryptor and the emitted JS decoder
# run the same block function; the symmetry test proves it. base64 fixes the
# exact standard alphabet the pool uses, getrandom is the production key source,
# and sha2 derives the deterministic per-file seed for --seed.
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
# Proxy-name pass: the token regex, the per-build keyed same-length rename
# (HMAC-SHA256), and the globs that select which files take the proxy path.
regex = "1"
hmac = "0.12"
globset = "0.4"
# SVG asset optimization (pass/svg.rs). oxvg is the Rust port of SVGO; its
# optimiser runs the same default job set svgo does, over a roxmltree-parsed
# document, so a built icon shrinks without a node svgmin step. oxvg_ast gives
# the parse and serialize entry points; the `roxmltree` feature is the light XML
# front end (no markup5ever, so no html5ever/tendril/string_cache pulled in).
oxvg_optimiser = "0.0.9"
oxvg_ast = { version = "0.0.9", features = ["roxmltree"] }
# CSS asset minification (pass/css.rs). lightningcss parses, minifies and
# reprints a stylesheet. It is already in the tree as a transitive dependency of
# oxvg_optimiser, so pinning the same version adds no new compiled crate. Pinned
# exact so the two requirements resolve to one copy.
lightningcss = "=1.0.0-alpha.72"
# HTML shell minification (pass/html.rs). minify-html's one-pass engine strips
# comments and collapses insignificant whitespace, HTML-aware so it never touches
# <pre>, <textarea>, <script> or <style> content. It returns an error on
# malformed input, which is the fail-closed path. Its JS and CSS minifiers are
# left off so estrogen's own passes stay the only thing that rewrites script and
# style bodies.
minify-html-onepass = "0.18"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
