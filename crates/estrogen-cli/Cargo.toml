[package]
name = "estrogen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line front end for estrogen, the post-build web obfuscator."

[[bin]]
name = "estrogen"
path = "src/main.rs"

[dependencies]
estrogen-core = { path = "../estrogen-core" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
