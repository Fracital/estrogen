[package]
name = "estrogen-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Library behind the estrogen web-build obfuscator: edit-and-splice core, config, file walk, and the obfuscation passes."

[lib]
name = "estrogen_core"
path = "src/lib.rs"

[dependencies]
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_ast.workspace = true
oxc_span.workspace = true
oxc_ast_visit.workspace = true
oxc_diagnostics.workspace = true
oxc_semantic.workspace = true
oxc_mangler.workspace = true
oxc_codegen.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
walkdir.workspace = true
rayon.workspace = true
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
regex.workspace = true
hmac.workspace = true
globset.workspace = true

# Asset optimizers for the svg, html and css passes. They pull heavy native
# dependencies, so they are built only for native targets, not for the wasm32
# in-browser binding (estrogen-wasm), which obfuscates a single JS string and
# never runs an asset step. The passes that use them are `#[cfg]`-gated to match.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxvg_optimiser.workspace = true
oxvg_ast.workspace = true
lightningcss.workspace = true
minify-html-onepass.workspace = true
